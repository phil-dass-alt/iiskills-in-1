# ─────────────────────────────────────────────────────────────────────────────
# iiskills.in — Nginx reverse-proxy configuration
#
# APPS + port assignments
# ─────────────────────────────────────────────────────────────────────────────
#   apps/main              → port 3000   https://iiskills.in
#   apps/learn-ai          → port 3002   https://learn-ai.iiskills.in
#   apps/learn-chemistry   → port 3005   https://learn-chemistry.iiskills.in
#   apps/learn-developer   → port 3006   https://learn-developer.iiskills.in
#   apps/learn-geography   → port 3007   https://learn-geography.iiskills.in
#   apps/learn-management  → port 3008   https://learn-management.iiskills.in
#   apps/learn-math        → port 3009   https://learn-math.iiskills.in
#   apps/learn-physics     → port 3010   https://learn-physics.iiskills.in
#   apps/learn-pr          → port 3011   https://learn-pr.iiskills.in
#   apps/learn-apt         → port 3012   https://learn-apt.iiskills.in
#   apps/web (admin)       → port 3040   https://admin.iiskills.in
#
# EXCLUDED (do not proxy):
#   process 0 (logrotate) — not a web process
#   any "copy" apps       — decommissioned
#
# Legacy iiskills.cloud config:
#   Keep in /etc/nginx/sites-available/iiskills.cloud.disabled
#   Do NOT symlink to sites-enabled — prevents port 80/443 collisions
#
# Rate-limiting zones — add inside the http{} block of /etc/nginx/nginx.conf:
#   limit_req_zone  $binary_remote_addr zone=iiskills_req:10m  rate=60r/m;
#   limit_conn_zone $binary_remote_addr zone=iiskills_conn:10m;
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstreams ─────────────────────────────────────────────────────────────────
upstream main_app         { server 127.0.0.1:3000; keepalive 8; }
upstream learn_ai         { server 127.0.0.1:3002; keepalive 8; }
upstream learn_chemistry  { server 127.0.0.1:3005; keepalive 8; }
upstream learn_developer  { server 127.0.0.1:3006; keepalive 8; }
upstream learn_geography  { server 127.0.0.1:3007; keepalive 8; }
upstream learn_management { server 127.0.0.1:3008; keepalive 8; }
upstream learn_math       { server 127.0.0.1:3009; keepalive 8; }
upstream learn_physics    { server 127.0.0.1:3010; keepalive 8; }
upstream learn_pr         { server 127.0.0.1:3011; keepalive 8; }
upstream learn_apt        { server 127.0.0.1:3012; keepalive 8; }
upstream web_admin        { server 127.0.0.1:3040; keepalive 8; }

# ── HTTP → HTTPS redirect for ALL iiskills.in domains ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name
        iiskills.in
        www.iiskills.in
        admin.iiskills.in
        learn-ai.iiskills.in
        learn-chemistry.iiskills.in
        learn-developer.iiskills.in
        learn-geography.iiskills.in
        learn-management.iiskills.in
        learn-math.iiskills.in
        learn-physics.iiskills.in
        learn-pr.iiskills.in
        learn-apt.iiskills.in;

    # Allow Let's Encrypt ACME challenge through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── iiskills.in — main landing page (port 3000) ───────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iiskills.in www.iiskills.in;

    ssl_certificate     /etc/letsencrypt/live/iiskills.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iiskills.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml text/x-component
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/truetype font/opentype application/vnd.ms-fontobject;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Static assets — content-hashed by Next.js, safe to cache indefinitely
    location /_next/static/ {
        proxy_pass         http://main_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        add_header         Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Next.js image optimisation endpoint — short TTL
    location /_next/image {
        proxy_pass         http://main_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
        add_header         Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass             http://main_app;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection 'upgrade';
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP          $remote_addr;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto  $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }
}

